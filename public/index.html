<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgerly</title>
<style>
  :root {
    --bg: #f5f4ef; --panel: #ffffff; --ink: #1d2126; --muted: #69707a; --line: #e3e0d8;
    --accent: #0e6b5c; --accent-ink: #ffffff; --accent-soft: #e2f1ed;
    --warn: #a84f06; --bad: #b3261e; --ok: #17803d; --shadow: 0 1px 2px rgba(20,20,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --panel: #1c2024; --ink: #e8eaed; --muted: #9aa1ab; --line: #2c3238;
      --accent: #3fb59f; --accent-ink: #08201b; --accent-soft: #1a2e2a;
      --warn: #e8a15c; --bad: #f2877f; --ok: #6fcf8e; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: -.01em; font-size: 18px; }
  .brand span { color: var(--accent); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  nav button { background: none; border: 0; padding: 7px 12px; border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; }
  nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav button:hover { color: var(--ink); }
  main { max-width: 1100px; margin: 0 auto; padding: 22px 20px 60px; }
  h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.01em; }
  h3 { margin: 26px 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 13px; border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.small { padding: 3px 9px; font-size: 13px; }
  .btn.danger { color: var(--bad); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .kpi .l { color: var(--muted); font-size: 13px; }
  .kpi .v { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .kpi.warn .v { color: var(--warn); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--accent-soft); }
  .tag { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 12.5px; background: var(--line); color: var(--ink); }
  .tag.approved, .tag.paid, .tag.fulfilled { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .tag.under_review, .tag.partial, .tag.confirmed, .tag.received { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .tag.documents_pending, .tag.requested, .tag.overdue { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .tag.void, .tag.cancelled { color: var(--muted); }
  .empty { padding: 26px; text-align: center; color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 24px)); box-shadow: 0 18px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10,12,14,.45); }
  .dlg { padding: 20px 22px 18px; max-height: 82vh; overflow: auto; }
  .dlg h2 { margin-bottom: 4px; }
  .dlg p.hint { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
  label { display: block; margin: 0 0 12px; }
  label .lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; text-transform: capitalize; }
  input, select, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  input[type="checkbox"] { width: auto; }
  textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .err { color: var(--bad); margin: 8px 0 0; font-size: 14px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: 14px; }
  #toast.on { opacity: 1; }
  .gate { max-width: 460px; margin: 70px auto; }
  .gate .card { padding: 22px; }
  .muted { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
</style>
</head>
<body>
<header>
  <div class="brand">Ledger<span>ly</span></div>
  <nav id="nav"></nav>
  <div class="row">
    <button class="btn primary" id="newBtn">New…</button>
    <button class="btn" id="keyBtn" title="Change API key">Key</button>
  </div>
</header>
<main id="main"></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status"></div>

<script>
"use strict";
const KEY_NAME = "ledgerly_api_key";
let apiKey = "";
try { apiKey = localStorage.getItem(KEY_NAME) || ""; } catch (e) {}
let schemas = {};
let currency = "USD";
let view = "dashboard";

// ---------- helpers ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const $ = (s) => document.querySelector(s);
const fmt = (n) => new Intl.NumberFormat(undefined, { style: "currency", currency }).format(n || 0);
const tag = (s) => h("span", { class: "tag " + s }, String(s).replace(/_/g, " "));
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600);
}

async function call(name, args) {
  const res = await fetch("/api/tools/" + name, {
    method: "POST",
    headers: { Authorization: "Bearer " + apiKey, "Content-Type": "application/json" },
    body: JSON.stringify(args || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { showGate("That API key was not accepted."); throw new Error("auth"); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function table(cols, rows, onClick) {
  if (!rows.length) return h("div", { class: "card" }, h("div", { class: "empty" }, "Nothing here yet."));
  return h("div", { class: "card" }, h("table", {},
    h("thead", {}, h("tr", {}, cols.map((c) => h("th", { class: c.num ? "num" : "" }, c.h)))),
    h("tbody", {}, rows.map((r) =>
      h("tr", { class: onClick ? "click" : "", onclick: onClick ? () => onClick(r) : null },
        cols.map((c) => h("td", { class: c.num ? "num" : "" }, c.f(r))))))));
}

function openDialog(...content) {
  const b = $("#dlgBody");
  b.replaceChildren(...content.flat(Infinity).filter((x) => x != null && x !== false));
  const d = $("#dlg"); if (!d.open) d.showModal();
}
function closeDialog() { $("#dlg").close(); }
$("#dlg").addEventListener("click", (e) => { if (e.target === $("#dlg")) closeDialog(); });

// ---------- generic form from a tool's JSON schema ----------
function example(s) {
  if (s.type === "object") { const o = {}; for (const [k, v] of Object.entries(s.properties || {})) o[k] = v.type === "integer" ? 1 : v.type === "number" ? 0 : ""; return o; }
  return "";
}
function openForm(toolName, title, hint) {
  const t = schemas[toolName]; if (!t) return;
  const props = t.inputSchema.properties || {}, req = t.inputSchema.required || [];
  const err = h("p", { class: "err" });
  const fields = Object.entries(props).map(([name, sch]) => {
    let input;
    if (sch.enum) input = h("select", { name }, req.includes(name) ? null : h("option", { value: "" }, "(not set)"), sch.enum.map((v) => h("option", { value: v }, v)));
    else if (sch.type === "boolean") input = h("input", { type: "checkbox", name });
    else if (sch.type === "number" || sch.type === "integer") input = h("input", { type: "number", name, step: sch.type === "integer" ? "1" : "0.01", min: "0" });
    else if (sch.type === "array") input = h("textarea", { name, rows: 4, "data-json": "1" }), input.value = JSON.stringify([example(sch.items)], null, 1);
    else input = h("input", { type: sch.format === "date" ? "date" : "text", name });
    const note = sch.type === "array" ? h("span", { class: "muted", style: "font-size:12.5px" }, " JSON list: edit the example") : null;
    return h("label", {}, h("span", { class: "lbl" }, name.replace(/_/g, " ") + (req.includes(name) ? " *" : ""), note), input);
  });
  const form = h("form", {}, fields, err,
    h("div", { class: "actions" },
      h("button", { type: "button", class: "btn", onclick: closeDialog }, "Cancel"),
      h("button", { type: "submit", class: "btn primary" }, "Save")));
  form.addEventListener("submit", async (e) => {
    e.preventDefault(); err.textContent = "";
    const args = {};
    try {
      for (const [name, sch] of Object.entries(props)) {
        const el = form.elements[name];
        if (sch.type === "boolean") { if (el.checked) args[name] = true; continue; }
        const v = el.value.trim(); if (v === "") continue;
        if (sch.type === "number" || sch.type === "integer") args[name] = Number(v);
        else if (sch.type === "array") args[name] = JSON.parse(v);
        else args[name] = v;
      }
    } catch (ex) { err.textContent = "Could not read the form: " + ex.message; return; }
    try { await call(toolName, args); closeDialog(); toast("Saved"); render(); }
    catch (ex) { if (ex.message !== "auth") err.textContent = ex.message; }
  });
  openDialog(h("h2", {}, title || t.title), h("p", { class: "hint" }, hint || t.description), form);
}

// ---------- views ----------
const views = {
  async dashboard(root) {
    const [d, aging] = await Promise.all([call("get_dashboard"), call("get_ar_aging")]);
    const k = (l, v, s, warn) => h("div", { class: "kpi" + (warn ? " warn" : "") }, h("div", { class: "l" }, l), h("div", { class: "v" }, v), s ? h("div", { class: "s" }, s) : null);
    root.append(
      h("h2", {}, "Dashboard"),
      h("div", { class: "kpis" },
        k("Cash", fmt(d.cash)),
        k("Receivables", fmt(d.accounts_receivable), d.open_invoices.count + " open invoice" + (d.open_invoices.count === 1 ? "" : "s")),
        k("Overdue", fmt(d.overdue_invoices.amount), d.overdue_invoices.count + " invoice" + (d.overdue_invoices.count === 1 ? "" : "s"), d.overdue_invoices.count > 0),
        k("Payables", fmt(d.accounts_payable)),
        k("Inventory value", fmt(d.inventory_value), d.low_stock_products + " low on stock", d.low_stock_products > 0),
        k("Revenue this month", fmt(d.this_month.revenue)),
        k("Expenses this month", fmt(d.this_month.expenses)),
        k("Net income this month", fmt(d.this_month.net_income)),
        k("Orders to fulfil", String(d.orders_awaiting_fulfilment))),
      h("h3", {}, "Client onboarding"),
      h("div", { class: "row" }, Object.keys(d.clients_by_status).length
        ? Object.entries(d.clients_by_status).map(([s, n]) => h("span", {}, tag(s), " ", n, "  "))
        : h("span", { class: "muted" }, "No clients yet.")),
      h("h3", {}, "Receivables aging"),
      table([
        { h: "Client", f: (r) => r.client },
        { h: "Current", num: 1, f: (r) => fmt(r.current) },
        { h: "1–30", num: 1, f: (r) => fmt(r.days_1_30) },
        { h: "31–60", num: 1, f: (r) => fmt(r.days_31_60) },
        { h: "61–90", num: 1, f: (r) => fmt(r.days_61_90) },
        { h: "90+", num: 1, f: (r) => fmt(r.days_over_90) },
        { h: "Total", num: 1, f: (r) => fmt(r.total) },
      ], aging.by_client));
  },

  async clients(root) {
    const { clients } = await call("list_clients");
    root.append(
      h("div", { class: "spread" }, h("h2", { style: "margin:0" }, "Clients"), h("button", { class: "btn primary", onclick: () => openForm("create_client") }, "New client")),
      table([
        { h: "Name", f: (r) => r.name },
        { h: "Email", f: (r) => r.email || "" },
        { h: "Status", f: (r) => tag(r.status) },
        { h: "Docs outstanding", num: 1, f: (r) => r.documents_outstanding },
      ], clients, (r) => clientDetail(r.id)));
  },

  async inventory(root) {
    const { products } = await call("list_products");
    root.append(
      h("div", { class: "spread" }, h("h2", { style: "margin:0" }, "Inventory"),
        h("div", { class: "row" },
          h("button", { class: "btn", onclick: () => openForm("add_product") }, "New product"),
          h("button", { class: "btn primary", onclick: () => openForm("receive_stock") }, "Receive stock"))),
      table([
        { h: "SKU", f: (r) => r.sku },
        { h: "Product", f: (r) => r.name },
        { h: "On hand", num: 1, f: (r) => r.stock_qty },
        { h: "Price", num: 1, f: (r) => fmt(r.unit_price) },
        { h: "Avg cost", num: 1, f: (r) => fmt(r.unit_cost) },
        { h: "Stock value", num: 1, f: (r) => fmt(r.stock_value) },
        { h: "", f: (r) => (r.low_stock ? h("span", { class: "tag overdue" }, "low stock") : "") },
      ], products));
  },

  async orders(root) {
    const { orders } = await call("list_orders");
    root.append(
      h("div", { class: "spread" }, h("h2", { style: "margin:0" }, "Orders"), h("button", { class: "btn primary", onclick: () => openForm("create_order") }, "New order")),
      table([
        { h: "Client", f: (r) => r.client },
        { h: "Items", f: (r) => r.items.map((i) => i.qty + " × " + i.sku).join(", ") },
        { h: "Total", num: 1, f: (r) => fmt(r.total) },
        { h: "Status", f: (r) => tag(r.status) },
        { h: "", f: (r) => r.status === "confirmed" ? h("span", { class: "row" },
            h("button", { class: "btn small primary", onclick: () => act("fulfill_order", { order_id: r.order_id }, "Order fulfilled and invoiced") }, "Fulfil"),
            h("button", { class: "btn small danger", onclick: () => act("cancel_order", { order_id: r.order_id }, "Order cancelled") }, "Cancel")) : "" },
      ], orders));
  },

  async invoices(root) {
    const { invoices } = await call("list_invoices");
    root.append(
      h("div", { class: "spread" }, h("h2", { style: "margin:0" }, "Invoices"), h("button", { class: "btn primary", onclick: () => openForm("create_invoice") }, "New invoice")),
      table([
        { h: "Number", f: (r) => r.number },
        { h: "Client", f: (r) => r.client },
        { h: "Due", f: (r) => r.due_date },
        { h: "Total", num: 1, f: (r) => fmt(r.total) },
        { h: "Balance", num: 1, f: (r) => fmt(r.balance) },
        { h: "Status", f: (r) => r.overdue ? h("span", { class: "tag overdue" }, r.days_overdue + "d overdue") : tag(r.status) },
      ], invoices, (r) => invoiceDetail(r.number)));
  },

  async reports(root) {
    const [tb, pl, j] = await Promise.all([call("get_trial_balance"), call("get_profit_and_loss"), call("get_journal", { limit: 15 })]);
    root.append(
      h("h2", {}, "Reports"),
      h("div", { class: "grid2" },
        h("div", {}, h("h3", { style: "margin-top:0" }, "Profit and loss, " + pl.from + " to " + pl.to),
          table([{ h: "Line", f: (r) => r[0] }, { h: "Amount", num: 1, f: (r) => fmt(r[1]) }], [
            ...pl.revenue.map((r) => [r.account, r.amount]),
            ["Total revenue", pl.total_revenue], ["Gross profit", pl.gross_profit],
            ...pl.expenses.map((r) => [r.account, -r.amount]),
            ["Net income", pl.net_income]])),
        h("div", {}, h("h3", { style: "margin-top:0" }, "Trial balance, " + tb.as_of),
          table([{ h: "Account", f: (r) => r.account }, { h: "Debit", num: 1, f: (r) => (r.debit ? fmt(r.debit) : "") }, { h: "Credit", num: 1, f: (r) => (r.credit ? fmt(r.credit) : "") }],
            [...tb.lines, { account: tb.balanced ? "Total (balanced)" : "Total (OUT OF BALANCE)", debit: tb.total_debit, credit: tb.total_credit }]))),
      h("h3", {}, "Latest journal entries"),
      table([
        { h: "Date", f: (e) => e.date }, { h: "Memo", f: (e) => e.memo },
        { h: "Lines", f: (e) => e.lines.map((l) => (l.debit ? "Dr " : "Cr ") + l.account + " " + fmt(l.debit || l.credit)).join("  ·  ") },
      ], j.entries),
      h("div", { class: "row", style: "margin-top:14px" },
        h("button", { class: "btn", onclick: () => openForm("record_expense") }, "Record expense"),
        h("button", { class: "btn", onclick: () => openForm("pay_supplier") }, "Pay supplier"),
        h("button", { class: "btn", onclick: () => openForm("record_owner_investment") }, "Owner investment")));
  },
};

async function act(name, args, msg) {
  try { await call(name, args); toast(msg); closeDialog(); render(); } catch (e) { if (e.message !== "auth") toast(e.message); }
}

async function clientDetail(id) {
  const c = await call("get_client", { client: id });
  const rows = c.documents.map((d) => h("tr", {},
    h("td", {}, d.doc_type.replace(/_/g, " ")), h("td", {}, tag(d.status)), h("td", { class: "muted" }, d.note || ""),
    h("td", {}, h("span", { class: "row" },
      d.status === "requested" ? h("button", { class: "btn small", onclick: () => docAct(id, d.doc_type, "received") }, "Mark received") : null,
      d.status !== "approved" ? h("button", { class: "btn small primary", onclick: () => docAct(id, d.doc_type, "approved") }, "Approve") : null,
      d.status !== "requested" ? h("button", { class: "btn small danger", onclick: () => docAct(id, d.doc_type, "rejected") }, "Reject") : null))));
  openDialog(
    h("h2", {}, c.name), h("p", { class: "hint" }, (c.email || "No email") + " · onboarding ", tag(c.status)),
    h("div", { class: "card" }, h("table", {}, h("tbody", {}, rows))),
    h("div", { class: "actions" }, h("button", { class: "btn", onclick: closeDialog }, "Close")));
}
async function docAct(id, doc, status) {
  try { await call("update_client_document", { client: id, doc_type: doc, status }); render(); await clientDetail(id); } catch (e) { if (e.message !== "auth") toast(e.message); }
}

async function invoiceDetail(number) {
  const i = await call("get_invoice", { invoice: number });
  const amount = h("input", { type: "number", step: "0.01", min: "0", value: i.balance || "" });
  const method = h("input", { type: "text", placeholder: "bank transfer, cheque…" });
  const err = h("p", { class: "err" });
  const canPay = (i.status === "open" || i.status === "partial") && i.balance > 0;
  openDialog(
    h("h2", {}, i.number), h("p", { class: "hint" }, i.client + " · issued " + i.issue_date + " · due " + i.due_date + " · ", tag(i.status)),
    h("div", { class: "card" }, h("table", {}, h("tbody", {},
      i.items.map((x) => h("tr", {}, h("td", {}, x.description), h("td", { class: "num" }, x.qty + " × " + fmt(x.unit_price)), h("td", { class: "num" }, fmt(x.line_total)))),
      h("tr", {}, h("td", {}, h("b", {}, "Total")), h("td", {}), h("td", { class: "num" }, h("b", {}, fmt(i.total)))),
      h("tr", {}, h("td", {}, "Paid"), h("td", {}), h("td", { class: "num" }, fmt(i.paid))),
      h("tr", {}, h("td", {}, h("b", {}, "Balance")), h("td", {}), h("td", { class: "num" }, h("b", {}, fmt(i.balance))))))),
    i.payments.length ? [h("h3", {}, "Payments"), h("div", { class: "card" }, h("table", {}, h("tbody", {},
      i.payments.map((p) => h("tr", {}, h("td", {}, p.date), h("td", {}, p.method || ""), h("td", { class: "num" }, fmt(p.amount))))))) ] : null,
    canPay ? [h("h3", {}, "Record payment"), h("div", { class: "grid2" }, h("label", {}, h("span", { class: "lbl" }, "amount"), amount), h("label", {}, h("span", { class: "lbl" }, "method"), method)), err] : null,
    h("div", { class: "actions" },
      i.status === "open" && !i.order_id ? h("button", { class: "btn danger", onclick: () => act("void_invoice", { invoice: i.number }, "Invoice voided") }, "Void") : null,
      h("button", { class: "btn", onclick: closeDialog }, "Close"),
      canPay ? h("button", { class: "btn primary", onclick: async () => {
        err.textContent = "";
        try { await call("record_payment", { invoice: i.number, amount: Number(amount.value), method: method.value || undefined }); toast("Payment recorded"); render(); await invoiceDetail(number); }
        catch (e) { if (e.message !== "auth") err.textContent = e.message; }
      } }, "Record payment") : null));
}

// ---------- shell ----------
const NAV = [["dashboard", "Dashboard"], ["clients", "Clients"], ["inventory", "Inventory"], ["orders", "Orders"], ["invoices", "Invoices"], ["reports", "Reports"]];
function renderNav() {
  $("#nav").replaceChildren(...NAV.map(([id, label]) => h("button", { "aria-current": String(id === view), onclick: () => { view = id; location.hash = id; render(); } }, label)));
}
async function render() {
  renderNav();
  const root = $("#main"); root.replaceChildren(h("p", { class: "muted" }, "Loading…"));
  const next = h("div", {});
  try { await views[view](next); root.replaceChildren(next); }
  catch (e) { if (e.message !== "auth") root.replaceChildren(h("p", { class: "err" }, e.message)); }
}

function showGate(msg) {
  $("#nav").replaceChildren();
  $("#main").replaceChildren(h("div", { class: "gate" }, h("div", { class: "card" }, h("div", { class: "dlg" },
    h("h2", {}, "Sign in with your API key"),
    h("p", { class: "hint" }, "Each company workspace has its own key (it starts with lgk_). Ask your administrator, or create one with POST /admin/orgs."),
    (() => {
      const inp = h("input", { type: "password", placeholder: "lgk_…", autocomplete: "off" });
      const err = h("p", { class: "err" }, msg || "");
      const go = async () => { apiKey = inp.value.trim(); try { localStorage.setItem(KEY_NAME, apiKey); } catch (e) {} await boot(); };
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      return h("div", {}, h("label", {}, inp), err, h("div", { class: "actions" }, h("button", { class: "btn primary", onclick: go }, "Continue")));
    })()))));
}

async function boot() {
  if (!apiKey) return showGate();
  const res = await fetch("/api/tools", { headers: { Authorization: "Bearer " + apiKey } });
  if (!res.ok) { apiKey = ""; try { localStorage.removeItem(KEY_NAME); } catch (e) {} return showGate(res.status === 401 ? "That API key was not accepted." : "Could not reach the API."); }
  const data = await res.json();
  currency = data.currency || "USD";
  schemas = Object.fromEntries(data.tools.map((t) => [t.name, t]));
  const fromHash = location.hash.slice(1);
  if (views[fromHash]) view = fromHash;
  render();
}

$("#newBtn").addEventListener("click", () => {
  if (!apiKey) return;
  const actions = [["create_client", "Client"], ["add_product", "Product"], ["receive_stock", "Stock received"], ["create_order", "Sales order"], ["create_invoice", "Invoice (services)"], ["record_expense", "Expense"], ["record_owner_investment", "Owner investment"], ["pay_supplier", "Supplier payment"]];
  openDialog(h("h2", {}, "New…"), h("p", { class: "hint" }, "Pick what you want to record."),
    h("div", { class: "grid2" }, actions.map(([n, l]) => h("button", { class: "btn", onclick: () => openForm(n) }, l))));
});
$("#keyBtn").addEventListener("click", () => { apiKey = ""; try { localStorage.removeItem(KEY_NAME); } catch (e) {} showGate(); });
boot();
</script>
</body>
</html>
